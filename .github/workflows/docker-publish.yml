name: Docker

on:
  push:
    branches:
      - 'master'
      - 'nightly'
  schedule:
    - cron: "0 2 * * *"
      timezone: "America/Montreal"

jobs:
  env:
    TARGET_BRANCH: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nightly for schedule
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Checkout pushed branch
        if: github.event_name != 'schedule'
        uses: actions/checkout@v7
    
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: acrisliu/shadowsocks-libev
          tags: |
            type=raw,value=latest,enable=${{ env.TARGET_BRANCH == 'master' }}
            type=raw,value=nightly,enable=${{ env.TARGET_BRANCH == 'nightly' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
